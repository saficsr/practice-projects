<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator-app">
        <div class="display">
            <input type="text" class="prev" id="prevDisplay" readonly>
            <input type="text" class="current" id="currentDisplay" readonly>
        </div>
        <div class="allBtn">
            <button class="btn clear" id="btn-clear">C</button>
            <button class="btn dot">.</button>
            <button class="btn remove">⌫</button>
            <button class="btn operator">+</button>
            <button class="btn number">7</button>
            <button class="btn number">8</button>
            <button class="btn number">9</button>
            <button class="btn operator">x</button>
            <button class="btn number">4</button>
            <button class="btn number">5</button>
            <button class="btn number">6</button>
            <button class="btn operator">-</button>
            <button class="btn number">1</button>
            <button class="btn number">2</button>
            <button class="btn number">3</button>
            <button class="btn equals">=</button>
            <button class="btn number" id="btn-zero">0</button>
            <button class="btn operator">/</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
